<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CareerGo | Profile</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="hero">
      <nav class="topbar container">
        <a class="brand" href="index.html">CareerGo</a>
        <div class="nav-links">
          <a href="index.html">Home</a>
        </div>
      </nav>
    </header>

    <main class="container">
      <section class="card-section">
        <div class="section-heading">
          <p class="eyebrow">Step 1</p>
          <h2>Your profile</h2>
          <p>Set up your education, skills, and experience before exploring opportunities.</p>
        </div>

        <form id="profile-form" class="card form-card">
          <div class="grid two-col">
            <label>
              Your name
              <input id="name" name="name" type="text" placeholder="Asha Patel" required />
            </label>
            <label>
              Education
              <input id="education" name="education" type="text" placeholder="B.Sc. Computer Science" required />
            </label>
          </div>
          <label>
            Skills
            <input id="skills" name="skills" type="text" placeholder="HTML, CSS, JavaScript, SQL" required />
          </label>
          <label>
            Short bio
            <textarea id="bio" name="bio" rows="4" placeholder="Recent graduate with a passion for problem solving and web development."></textarea>
          </label>
          <button type="submit" class="primary-btn">Save Profile</button>
        </form>
      </section>
    </main>

    <script src="app.js"></script>
    <script>
      document.addEventListener('DOMContentLoaded', function () {
        const currentUser = JSON.parse(localStorage.getItem('currentUser') || 'null');
        if (!currentUser) {
          alert('Please log in or continue as guest to view your profile.');
          window.location.href = 'login.html';
        }
      });
    </script>
  </body>
</html>
